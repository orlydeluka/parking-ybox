# פריסה בלחיצה ב-Render: New → Blueprint → בחירת הריפו
services:
  - type: web
    name: invoice-mailer
    runtime: docker
    rootDir: invoice-mailer
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: API_TOKEN
        generateValue: true
      - key: MAIL_TO
        value: orlyg@timlul.com
      - key: MAIL_FROM
        value: orlyg@timlul.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: orlyg@timlul.com
      - key: SMTP_PASS
        sync: false
      - key: KEYWORDS
        value: חשבונית,קבלה,invoice,receipt
